[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typefast"
version = "0.1.0"
description = "Dictate anywhere on Ubuntu: live speech to text, then a polished final pass."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.22",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "PySide6-Essentials>=6.8; sys_platform == 'win32'",
]
# On Linux, PyGObject (GTK 3, AyatanaAppIndicator) and pycairo come from apt; see install.sh.

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
typefast = "typefast.__main__:main"

[tool.setuptools]
packages = ["typefast"]

[tool.setuptools.package-data]
typefast = ["style.css", "icons/*.svg"]
